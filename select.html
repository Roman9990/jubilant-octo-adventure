<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ночной лучь — выбор телехранителя</title>
<style>
:root{
  --bg:#0b0f17; --panel:#121827; --muted:#8aa0c6; --text:#e6ecff; --acc:#7c9cff; --ok:#39d98a; --warn:#ffd166;
  --card:#0f1626; --glow:rgba(124,156,255,.35);
}
*{box-sizing:border-box}
body{
  margin:0; padding:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;
  background: radial-gradient(1200px 800px at 20% -10%,#1a2240 0%,rgba(26,34,64,0) 60%),
              radial-gradient(1000px 600px at 100% 0%,#15233a 0%,rgba(21,35,58,0) 60%),
              var(--bg);
  color:var(--text);
}
.container{max-width:980px;margin:0 auto;padding:20px}
.header{
  display:flex;align-items:center;justify-content:space-between;margin:10px 0 20px 0
}
.brand{display:flex;gap:12px;align-items:center}
.brand .logo{
  width:40px;height:40px;border-radius:12px;background: linear-gradient(135deg,#8b5cf6,#06b6d4);
  box-shadow:0 0 30px rgba(124,156,255,.25), 0 0 60px rgba(6,182,212,.18);
}
.brand h1{font-size:18px;margin:0;letter-spacing:.3px}
.toolbar{display:flex;gap:10px;align-items:center}
.btn{
  background: linear-gradient(135deg, #1e2a4a, #11182b);
  color:var(--text); border:1px solid rgba(124,156,255,.25); border-radius:12px; padding:10px 14px;
  cursor:pointer; transition:.2s; font-weight:600; letter-spacing:.3px
}
.btn:hover{ transform:translateY(-1px); box-shadow:0 6px 26px var(--glow) }
.badge{padding:4px 8px;border-radius:999px;background:#1b2440;border:1px solid rgba(124,156,255,.25);color:var(--muted);font-weight:600}
.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-top:14px
}
.card{
  background: linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.0));
  border:1px solid rgba(124,156,255,.22); border-radius:16px; padding:16px;
  box-shadow: 0 0 0 1px rgba(255,255,255,.02) inset, 0 12px 42px rgba(10,20,45,.35);
}
.tag{
  font-size:22px; font-weight:800; letter-spacing:1px; color:#cfe1ff; text-shadow:0 0 18px rgba(124,156,255,.35)
}
.meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin:8px 0 12px 0}
.star{color:#ffd166; margin-left:6px}
.pick{display:flex;gap:10px}
.pick .btn{flex:1}
.footer{margin:32px 0;color:var(--muted);font-size:12px}
hr{border:none;height:1px;background:linear-gradient(90deg,transparent,rgba(124,156,255,.2),transparent);margin:14px 0}
.empty{
  border:1px dashed rgba(124,156,255,.35); border-radius:16px; padding:22px; color:var(--muted); text-align:center
}
.toast{
  position:fixed; right:16px; bottom:16px; background:#0f172a; color:#e6ecff; padding:12px 14px; border-radius:12px;
  border:1px solid rgba(124,156,255,.3); box-shadow:0 8px 36px rgba(12,18,32,.45); opacity:0; transform:translateY(10px);
  transition:.24s ease
}
.toast.show{opacity:1; transform:translateY(0)}
a.link{color:#9bb6ff}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="brand">
      <div class="logo"></div>
      <h1>≪ Ночной лучь ≫ · выбор телехранителя</h1>
    </div>
    <div class="toolbar">
      <span id="ttl" class="badge">сессия: —</span>
      <button class="btn" id="refresh">Обновить список</button>
    </div>
  </div>
  <p style="color:var(--muted);margin-top:0">Вы видите только теги. Имена и usernames скрыты. Выберите того, кто откликнется первым и нежнее всего ✨</p>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">Пока все телехранители заняты. Попробуйте обновить позже.</div>
  <div class="footer">
    Поддержка: <a class="link" href="https://t.me/" target="_blank" rel="noreferrer">связь</a> · Автообновление каждые <b>30</b> сек · Токен действителен 10 минут
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const q = new URLSearchParams(location.search);
const token = q.get('token') || '';
if(!token){ document.getElementById('grid').innerHTML=''; document.getElementById('empty').style.display='block'; }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

function ttlTick(exp){
  function once(){
    const left = Math.max(0, Math.floor((exp*1000 - Date.now())/1000));
    const m = Math.floor(left/60), s = (left%60).toString().padStart(2,'0');
    document.getElementById('ttl').textContent = `сессия: ${m}:${s}`;
  }
  once(); setInterval(once, 1000);
}

async function fetchAdmins(){
  const res = await fetch(`/api/admins?token=${encodeURIComponent(token)}`);
  const data = await res.json();
  if(data.error){
    document.getElementById('grid').innerHTML='';
    document.getElementById('empty').style.display='block';
    showToast(data.error);
    return;
  }
  const {admins, exp} = data;
  if(exp){ ttlTick(exp); }
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  document.getElementById('empty').style.display = admins.length? 'none' : 'block';
  admins.forEach(a=>{
    const d = document.createElement('div'); d.className='card';
    d.innerHTML = `\n      <div class="tag">#${a.tag}${a.premium?'<span class="star">⭐</span>':''}</div>\n      <div class="meta">\n        <span>${a.premium ? 'премиум' : 'обычный'}</span> ·\n        <span>активность: ${a.active_ago}</span>\n      </div>\n      <div class="pick">\n        <button class="btn" data-tag="${a.tag}">Выбрать</button>\n      </div>\n    `;
    grid.appendChild(d);
  });
  grid.querySelectorAll('button[data-tag]').forEach(btn=>{
    btn.addEventListener('click', ()=> pick(btn.dataset.tag));
  });
}

async function pick(tag){
  const res = await fetch('/api/pick', {
    method:'POST',
    headers:{'content-type':'application/json'},
    body: JSON.stringify({ token, tag })
  });
  const data = await res.json();
  if(data.ok){
    showToast('Готово! Проверьте диалог в Telegram.');
    setTimeout(()=>location.href='/done', 800);
  }else{
    showToast(data.error || 'Не удалось выбрать');
    if(data.refresh){ fetchAdmins(); }
  }
}

document.getElementById('refresh').addEventListener('click', fetchAdmins);
setInterval(fetchAdmins, 30000);
fetchAdmins();
</script>
</body>
</html>
